name: efe_mobile
description: "EFE Academia de Ingles"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^14.0.0
  dio: ^5.4.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.8.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.0
  file_picker: ^8.0.0
  open_file: ^3.3.0
  path: ^1.9.0
  connectivity_plus: ^5.0.0
  shimmer: ^3.0.0
  easy_refresh: ^3.0.0
  phosphor_flutter: ^2.0.0
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_dotenv: ^5.1.0
  laravel_reverb: ^0.7.1
  url_launcher: ^6.3.1
  pdfrx: 2.4.8 # Fijado: 2.5.0+ exige Flutter 3.47 (IconData final etc.); 2.4.x pide Flutter >=3.41
  path_provider: ^2.1.5
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^19.5.0
  uuid: ^4.6.0
  window_manager: 0.4.3
  launch_at_startup: ^0.3.1
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.4
  json_serializable: ^6.7.0
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/

# phosphor_flutter 2.1.0 (pub.dev) no compila en Flutter >=3.43 porque
# IconData es final. Se usa copia vendorizada con el parche descrito en
# vendor/phosphor_flutter/PATCH_NOTES.md (mismos glyphs y fuentes).
dependency_overrides:
  phosphor_flutter:
    path: vendor/phosphor_flutter
