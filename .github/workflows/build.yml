name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure app (preprod)
        shell: bash
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=https://preprod.efeacademia.com/api/v1
          REVERB_HOST=preprod.efeacademia.com
          REVERB_PORT=8181
          REVERB_APP_KEY=
          REVERB_SCHEME=https
          EOF

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package
        run: tar -czf efe-mobile-linux-x86_64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: efe-mobile-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure app (preprod)
        shell: bash
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=https://preprod.efeacademia.com/api/v1
          REVERB_HOST=preprod.efeacademia.com
          REVERB_PORT=8181
          REVERB_APP_KEY=
          REVERB_SCHEME=https
          EOF

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\efe-mobile-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/efe-mobile-windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure app (preprod)
        shell: bash
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=https://preprod.efeacademia.com/api/v1
          REVERB_HOST=preprod.efeacademia.com
          REVERB_PORT=8181
          REVERB_APP_KEY=
          REVERB_SCHEME=https
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Package
        run: cp build/app/outputs/flutter-apk/app-release.apk efe-mobile-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: efe-mobile-android.apk

  release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: ./artifacts

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android
          path: ./artifacts

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$VERSION" ]; then
            echo "No se pudo extraer la versión de pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        timeout-minutes: 15
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: EFE Mobile v${{ steps.version.outputs.version }}
          files: |
            artifacts/efe-mobile-linux-x86_64.tar.gz
            artifacts/efe-mobile-windows-x64.zip
            artifacts/efe-mobile-android.apk
          generate_release_notes: true